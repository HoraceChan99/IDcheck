<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"

  <title>UIC ID Checker</title>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;

      margin: 20px 0 8px;

      width: 100%;

    /* Centered scanning box */
    #scan-box {
      position: absolute;
      left: 8%;

      border: 3px solid white;
      border-radius: 12px;

      display: flex;
      align-items: flex-start;
      justify-content: center;

      pointer-events: none;
    }

    #scan-label {
      background: rgba(0, 0, 0, 0.75);

  </style>
</head>

<body>

  <h1>UIC ID Checker</h1>

  <div id="status">
    Position UIN in the box
  </div>

  <div id="camera-container">

    <video
      id="video"
      autoplay
      playsinline
      muted
    ></video>

    <div id="scan-box">
      <div id="scan-label">
        Position UIN in this box
      </div>
    </div>

  </div>

  <div id="result"></div>

  <div id="uin"></div>

  <div id="debug"></div>

  <canvas id="canvas" style="display:none;"></canvas>


<script>

const TARGET_UIN = "678963265";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");

const result = document.getElementById("result");
const uinDisplay = document.getElementById("uin");
const status = document.getElementById("status");
const debug = document.getElementById("debug");

let scanning = false;
let lastScanTime = 0;


// --------------------------------------------------
// Start camera
// --------------------------------------------------

async function startCamera() {

  try {

    const stream = await navigator.mediaDevices.getUserMedia({

      video: {
        facingMode: {
          ideal: "environment"
        },

        width: {
          ideal: 1920
        },

        height: {
          ideal: 1080
        }
      },

      audio: false

    });

    video.srcObject = stream;

    await video.play();

    status.textContent =
      "Position UIN in the box";

    scanning = true;

    scanLoop();

  } catch (error) {

    console.error(error);

    status.textContent =
      "Camera access failed. Please allow camera access.";

  }

}


// --------------------------------------------------
// Capture the camera frame
// --------------------------------------------------

function captureFrame() {

  const width = video.videoWidth;
  const height = video.videoHeight;

  canvas.width = width;
  canvas.height = height;

  const ctx = canvas.getContext("2d");

  ctx.drawImage(
    video,
    0,
    0,
    width,
    height
  );

  return canvas;

}


// --------------------------------------------------
// Crop the CENTER scanning box
// --------------------------------------------------

function cropScanningBox(sourceCanvas) {

  const width = sourceCanvas.width;
  const height = sourceCanvas.height;

  /*
    This corresponds approximately to:

       left:   8%
       top:   35%
       width: 84%
       height:30%

    Same proportions as the visible box.
  */

  const x = width * 0.08;
  const y = height * 0.35;

  const cropWidth = width * 0.84;
  const cropHeight = height * 0.30;

  const cropCanvas =
    document.createElement("canvas");

  cropCanvas.width = cropWidth;
  cropCanvas.height = cropHeight;

  const ctx =
    cropCanvas.getContext("2d");

  ctx.drawImage(

    sourceCanvas,

    x,
    y,
    cropWidth,
    cropHeight,

    0,
    0,
    cropWidth,
    cropHeight

  );

  return cropCanvas;

}


// --------------------------------------------------
// Extract UIN
// --------------------------------------------------

function extractUIN(text) {

  /*
    Example OCR:

        UIN 678963265

    or:

        UIN
        678963265

    or:

        UIN: 678963265
  */

  const normalized =
    text
      .toUpperCase()
      .replace(/\s+/g, " ")
      .trim();

  console.log("OCR:", normalized);

  debug.textContent =
    "OCR: " + normalized;


  // -----------------------------------------------
  // Look for UIN followed by 9 digits
  // -----------------------------------------------

  let match =
    normalized.match(
      /UIN[\s:.-]*(\d{9})/
    );

  if (match) {

    return match[1];

  }


  // -----------------------------------------------
  // Sometimes OCR separates the digits
  //
  // Example:
  //
  // UIN 678 963 265
  // -----------------------------------------------

  match =
    normalized.match(
      /UIN[\s:.-]*(\d{3})[\s-]*(\d{3})[\s-]*(\d{3})/
    );

  if (match) {

    return (
      match[1] +
      match[2] +
      match[3]
    );

  }


  return null;

}


// --------------------------------------------------
// Verify UIN
// --------------------------------------------------

function verifyUIN(uin) {

  uinDisplay.textContent =
    "UIN: " + uin;


  if (uin === TARGET_UIN) {

    result.textContent = "✓";

    result.className = "green";

    status.textContent =
      "ID VERIFIED";

  } else {

    result.textContent = "✕";

    result.className = "red";

    status.textContent =
      "UIN DOES NOT MATCH";

  }

}


// --------------------------------------------------
// Clear result
// --------------------------------------------------

function clearResult() {

  result.textContent = "";

  result.className = "";

  uinDisplay.textContent = "";

  debug.textContent = "";

  status.textContent =
    "Position UIN in the box";

}


// --------------------------------------------------
// OCR one frame
// --------------------------------------------------

async function scanFrame() {

  if (!scanning) {
    return;
  }

  const now = Date.now();

  /*
    Don't run OCR continuously at 30 FPS.

    Wait approximately 1 second between OCR attempts.
  */

  if (now - lastScanTime < 1000) {
    return;
  }

  lastScanTime = now;


  try {

    const frame =
      captureFrame();

    const cropped =
      cropScanningBox(frame);


    status.textContent =
      "Reading UIN...";


    const resultData =
      await Tesseract.recognize(

        cropped,

        "eng",

        {
          logger: message => {

            if (
              message.status ===
              "recognizing text"
            ) {

              const progress =
                Math.round(
                  message.progress * 100
                );

              status.textContent =
                `Reading UIN... ${progress}%`;

            }

          }
        }

      );


    const text =
      resultData.data.text;


    const uin =
      extractUIN(text);


    if (uin) {

      /*
        Stop scanning while showing result.
      */

      scanning = false;

      verifyUIN(uin);


      /*
        Automatically reset after
        2.5 seconds.
      */

      setTimeout(() => {

        clearResult();

        scanning = true;

        scanLoop();

      }, 2500);

    } else {

      status.textContent =
        "Position UIN in the box";

    }

  } catch (error) {

    console.error(error);

    status.textContent =
      "Scanning...";

  }

}


// --------------------------------------------------
// Continuous scanning loop
// --------------------------------------------------

function scanLoop() {

  if (!scanning) {
    return;
  }

  scanFrame();

  /*
    Check frequently, while OCR itself
    is throttled to ~1 second.
  */

  setTimeout(
    scanLoop,
    100
  );

}


// --------------------------------------------------
// Start
// --------------------------------------------------

startCamera();

</script>

</body>
</html>
