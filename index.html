<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  />

  <title>UIC ID Checker Demo</title>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    h1 {
      font-size: 24px;
      margin: 20px 0 8px;
    }

    #status {
      color: #aaa;
      margin-bottom: 15px;
    }

    #camera-container {
      position: relative;
      width: 95%;
      max-width: 500px;
      margin: auto;
    }

    video {
      width: 100%;
      border-radius: 12px;
      display: block;
    }

    /* Approximate location of the UIN on the card */
    #scan-box {
      position: absolute;
      left: 5%;
      bottom: 5%;
      width: 45%;
      height: 20%;
      border: 3px solid white;
      border-radius: 8px;
      pointer-events: none;
    }

    button {
      margin-top: 20px;
      padding: 14px 28px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: white;
      color: black;
    }

    #result {
      margin: 25px auto;
      font-size: 100px;
      width: 150px;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #uin {
      font-size: 24px;
      min-height: 30px;
    }

    .green {
      color: #20c76b;
    }

    .red {
      color: #ff4040;
    }
  </style>
</head>

<body>

  <h1>UIC ID Checker</h1>

  <div id="status">Point your camera at the UIC i-card</div>

  <div id="camera-container">
    <video id="video" autoplay playsinline></video>
    <div id="scan-box"></div>
  </div>

  <button id="scanButton">SCAN ID</button>

  <div id="result"></div>

  <div id="uin"></div>

  <canvas id="canvas" style="display:none;"></canvas>

<script>
const TARGET_UIN = "678963265";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const scanButton = document.getElementById("scanButton");
const result = document.getElementById("result");
const uinDisplay = document.getElementById("uin");
const status = document.getElementById("status");

let stream = null;


// --------------------------------------------------
// Start camera
// --------------------------------------------------

async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: {
          ideal: "environment"
        },
        width: {
          ideal: 1920
        },
        height: {
          ideal: 1080
        }
      },
      audio: false
    });

    video.srcObject = stream;

    status.textContent = "Position the UIC i-card inside the box";

  } catch (error) {
    console.error(error);
    status.textContent = "Camera access failed.";
  }
}


// --------------------------------------------------
// Capture image
// --------------------------------------------------

function captureImage() {

  const videoWidth = video.videoWidth;
  const videoHeight = video.videoHeight;

  canvas.width = videoWidth;
  canvas.height = videoHeight;

  const ctx = canvas.getContext("2d");

  ctx.drawImage(
    video,
    0,
    0,
    videoWidth,
    videoHeight
  );

  return canvas;
}


// --------------------------------------------------
// Crop bottom-left UIN area
// --------------------------------------------------

function cropUINRegion(sourceCanvas) {

  const width = sourceCanvas.width;
  const height = sourceCanvas.height;

  /*
    Approximate UIN location:

    left  = 5%
    right = 50%
    bottom = 5%
    height = 20%
  */

  const cropX = width * 0.05;
  const cropY = height * 0.75;

  const cropWidth = width * 0.45;
  const cropHeight = height * 0.20;

  const cropCanvas = document.createElement("canvas");

  cropCanvas.width = cropWidth;
  cropCanvas.height = cropHeight;

  const ctx = cropCanvas.getContext("2d");

  ctx.drawImage(
    sourceCanvas,
    cropX,
    cropY,
    cropWidth,
    cropHeight,
    0,
    0,
    cropWidth,
    cropHeight
  );

  return cropCanvas;
}


// --------------------------------------------------
// Extract 9-digit UIN
// --------------------------------------------------

function extractUIN(text) {

  console.log("OCR TEXT:");
  console.log(text);

  /*
    OCR may interpret:

      UIN 678963265

    as:

      UIN
      678963265

    or even:

      UIN 678963265

    We therefore look for any 9-digit sequence.
  */

  const matches = text.match(/\b\d{9}\b/g);

  if (matches && matches.length > 0) {
    return matches[0];
  }

  /*
    Sometimes OCR inserts spaces:

      678 963 265

  */

  const cleaned = text.replace(/\D/g, "");

  if (cleaned.length >= 9) {
    const possibleUIN = cleaned.match(/\d{9}/);

    if (possibleUIN) {
      return possibleUIN[0];
    }
  }

  return null;
}


// --------------------------------------------------
// Scan
// --------------------------------------------------

async function scanID() {

  result.textContent = "";
  result.className = "";
  uinDisplay.textContent = "";

  status.textContent = "Scanning...";

  scanButton.disabled = true;

  try {

    const fullImage = captureImage();

    const uinImage = cropUINRegion(fullImage);

    /*
      Tesseract OCR
    */

    const { data: { text } } = await Tesseract.recognize(
      uinImage,
      "eng",
      {
        logger: message => {

          if (message.status === "recognizing text") {

            const progress =
              Math.round(message.progress * 100);

            status.textContent =
              `Reading UIN... ${progress}%`;
          }
        }
      }
    );

    const uin = extractUIN(text);

    if (!uin) {

      status.textContent = "Could not detect a 9-digit UIN.";

      result.textContent = "❓";

      scanButton.disabled = false;

      return;
    }

    console.log("Detected UIN:", uin);

    uinDisplay.textContent = `UIN: ${uin}`;

    // ------------------------------------------------
    // Compare UIN
    // ------------------------------------------------

    if (uin === TARGET_UIN) {

      result.textContent = "✓";
      result.className = "green";

      status.textContent = "ID VERIFIED";

    } else {

      result.textContent = "✕";
      result.className = "red";

      status.textContent = "UIN DOES NOT MATCH";

    }

  } catch (error) {

    console.error(error);

    status.textContent = "Scanning failed.";

    result.textContent = "⚠️";

  }

  scanButton.disabled = false;
}


// --------------------------------------------------
// Button
// --------------------------------------------------

scanButton.addEventListener("click", scanID);


// --------------------------------------------------
// Start
// --------------------------------------------------

startCamera();

</script>

</body>
</html>
