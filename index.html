```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  />

  <title>UIC ID Checker</title>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }

    h1 {
      margin: 20px 0 8px;
      font-size: 24px;
    }

    #status {
      color: #aaa;
      font-size: 16px;
      margin-bottom: 18px;
    }

    #camera-container {
      position: relative;
      width: 95%;
      max-width: 600px;
      margin: auto;
      overflow: hidden;
      border-radius: 14px;
    }

    video {
      width: 100%;
      display: block;
    }

    /* --------------------------------------------------
       Centered scanning box
       ORIGINAL SIZE AND POSITION
       -------------------------------------------------- */

    #scan-box {
      position: absolute;
      left: 8%;
      top: 35%;
      width: 84%;
      height: 30%;

      border: 3px solid white;
      border-radius: 12px;

      display: flex;
      align-items: flex-start;
      justify-content: center;

      pointer-events: none;
    }

    #scan-label {
      background: rgba(0, 0, 0, 0.75);
      padding: 8px 14px;
      border-radius: 0 0 8px 8px;
      font-size: 16px;
      margin-top: -1px;
    }

    /* --------------------------------------------------
       Verification result
       
       Positioned directly BELOW the scan box,
       but still OVER the camera.
       -------------------------------------------------- */

    #verification-result {
      position: absolute;

      left: 8%;
      width: 84%;

      /*
        Scan box:
          top = 35%
          height = 30%

        Therefore bottom = 65%.

        Put result just below it.
      */

      top: 66%;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;

      pointer-events: none;
    }

    #result {
      width: 55px;
      height: 55px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 55px;
      line-height: 1;

      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
    }

    #uin {
      font-size: 22px;
      font-weight: 600;

      min-height: 30px;
      margin-top: 2px;

      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
    }

    #verification-message {
      font-size: 16px;
      font-weight: 600;

      min-height: 22px;
      margin-top: 2px;

      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
    }

    #result.green,
    #verification-message.green {
      color: #20c76b;
    }

    #result.red,
    #verification-message.red {
      color: #ff4040;
    }

    #debug {
      color: #777;
      font-size: 12px;
      margin-top: 20px;
      padding: 0 15px;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <h1>UIC ID Checker</h1>

  <div id="status">
    Position iCard in this box
  </div>

  <div id="camera-container">

    <video
      id="video"
      autoplay
      playsinline
      muted
    ></video>


    <!-- Scan box -->

    <div id="scan-box">
      <div id="scan-label">
        Position iCard in this box
      </div>
    </div>


    <!-- Verification result
         Positioned directly below scan box -->

    <div id="verification-result">

      <div id="result"></div>

      <div id="uin"></div>

      <div id="verification-message"></div>

    </div>

  </div>


  <div id="debug"></div>

  <canvas
    id="canvas"
    style="display:none;"
  ></canvas>


<script>

const TARGET_UIN = "678963265";

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const result =
  document.getElementById("result");

const uinDisplay =
  document.getElementById("uin");

const verificationMessage =
  document.getElementById("verification-message");

const status =
  document.getElementById("status");

const debug =
  document.getElementById("debug");


let scanning = false;
let lastScanTime = 0;


// --------------------------------------------------
// Start camera
// --------------------------------------------------

async function startCamera() {

  try {

    const stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1920
          },

          height: {
            ideal: 1080
          }

        },

        audio: false

      });


    video.srcObject =
      stream;


    await video.play();


    status.textContent =
      "Position iCard in this box";


    scanning = true;

    scanLoop();

  }

  catch (error) {

    console.error(error);

    status.textContent =
      "Camera access failed. Please allow camera access.";

  }

}


// --------------------------------------------------
// Capture camera frame
// --------------------------------------------------

function captureFrame() {

  const width =
    video.videoWidth;

  const height =
    video.videoHeight;


  canvas.width =
    width;

  canvas.height =
    height;


  const ctx =
    canvas.getContext("2d");


  ctx.drawImage(
    video,
    0,
    0,
    width,
    height
  );


  return canvas;

}


// --------------------------------------------------
// Crop bottom-left portion of scanning box
// --------------------------------------------------

function cropScanningBox(sourceCanvas) {

  const width =
    sourceCanvas.width;

  const height =
    sourceCanvas.height;


  /*
    Visible scan box:

        left:   8%
        top:   35%
        width: 84%
        height:30%

    OCR region:

        left 60% of scan box
        bottom 40% of scan box
  */


  const boxX =
    width * 0.08;

  const boxY =
    height * 0.35;

  const boxWidth =
    width * 0.84;

  const boxHeight =
    height * 0.30;


  const x =
    boxX;

  const y =
    boxY +
    boxHeight * 0.60;

  const cropWidth =
    boxWidth * 0.60;

  const cropHeight =
    boxHeight * 0.40;


  const cropCanvas =
    document.createElement("canvas");


  /*
    Upscale OCR region.
  */

  const scale = 2;


  cropCanvas.width =
    cropWidth * scale;

  cropCanvas.height =
    cropHeight * scale;


  const ctx =
    cropCanvas.getContext("2d");


  ctx.drawImage(

    sourceCanvas,

    x,
    y,
    cropWidth,
    cropHeight,

    0,
    0,
    cropWidth * scale,
    cropHeight * scale

  );


  return cropCanvas;

}


// --------------------------------------------------
// Extract UIN
// --------------------------------------------------

function extractUIN(text) {

  const normalized =
    text
      .toUpperCase()
      .replace(/\s+/g, " ")
      .trim();


  console.log(
    "OCR:",
    normalized
  );


  debug.textContent =
    "OCR: " + normalized;


  // -----------------------------------------------
  // UIN + 9 consecutive digits
  // -----------------------------------------------

  let match =
    normalized.match(
      /UIN[\s:.-]*(\d{9})/
    );


  if (match) {

    return match[1];

  }


  // -----------------------------------------------
  // UIN + digits separated into groups
  // -----------------------------------------------

  match =
    normalized.match(
      /UIN[\s:.-]*(\d{3})[\s-]*(\d{3})[\s-]*(\d{3})/
    );


  if (match) {

    return (
      match[1] +
      match[2] +
      match[3]
    );

  }


  // -----------------------------------------------
  // Fallback: any 9-digit number
  // -----------------------------------------------

  match =
    normalized.match(
      /\b(\d{9})\b/
    );


  if (match) {

    return match[1];

  }


  return null;

}


// --------------------------------------------------
// Verify UIN
// --------------------------------------------------

function verifyUIN(uin) {

  uinDisplay.textContent =
    "UIN: " + uin;


  if (uin === TARGET_UIN) {

    result.textContent =
      "✓";

    result.className =
      "green";


    verificationMessage.textContent =
      "ID VERIFIED";

    verificationMessage.className =
      "green";

  }

  else {

    result.textContent =
      "✕";

    result.className =
      "red";


    verificationMessage.textContent =
      "UIN DOES NOT MATCH";

    verificationMessage.className =
      "red";

  }

}


// --------------------------------------------------
// Clear result
// --------------------------------------------------

function clearResult() {

  result.textContent =
    "";

  result.className =
    "";


  uinDisplay.textContent =
    "";


  verificationMessage.textContent =
    "";

  verificationMessage.className =
    "";


  debug.textContent =
    "";


  status.textContent =
    "Position iCard in this box";

}


// --------------------------------------------------
// OCR one frame
// --------------------------------------------------

async function scanFrame() {

  if (!scanning) {
    return;
  }


  const now =
    Date.now();


  /*
    Approximately one OCR attempt
    per second.
  */

  if (
    now - lastScanTime < 1000
  ) {

    return;

  }


  lastScanTime =
    now;


  try {

    const frame =
      captureFrame();


    /*
      Only the bottom-left portion
      of the scan box is OCR'd.
    */

    const cropped =
      cropScanningBox(frame);


    status.textContent =
      "Reading UIN...";


    const resultData =
      await Tesseract.recognize(

        cropped,

        "eng",

        {

          logger: message => {

            if (
              message.status ===
              "recognizing text"
            ) {

              const progress =
                Math.round(
                  message.progress * 100
                );


              status.textContent =
                `Reading UIN... ${progress}%`;

            }

          }

        }

      );


    const text =
      resultData.data.text;


    const uin =
      extractUIN(text);


    if (uin) {

      /*
        Stop scanning while
        displaying result.
      */

      scanning =
        false;


      verifyUIN(uin);


      /*
        Reset after 2.5 seconds.
      */

      setTimeout(() => {

        clearResult();

        scanning =
          true;

        scanLoop();

      }, 2500);

    }

    else {

      status.textContent =
        "Position iCard in this box";

    }

  }

  catch (error) {

    console.error(error);

    status.textContent =
      "Scanning...";

  }

}


// --------------------------------------------------
// Continuous scanning loop
// --------------------------------------------------

function scanLoop() {

  if (!scanning) {
    return;
  }


  scanFrame();


  setTimeout(
    scanLoop,
    100
  );

}


// --------------------------------------------------
// Start
// --------------------------------------------------

startCamera();

</script>

</body>
</html>
